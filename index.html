<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laweyan HIHU</title>
<style>
:root{--bg:#eef5ee;--card:#fff;--tx:#14261a;--mu:#5d7363;--g:#1b5e20;--g2:#2e7d32;--gl:#c8e6c9;--go:#c9a227;--bd:#d4e3d6;--red:#d32f2f;--on:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a11;--card:#16251a;--tx:#e6f2e8;--mu:#93aa98;--g:#2e7d32;--g2:#43a047;--gl:#1f3a24;--bd:#2a4030}}
:root[data-theme="dark"]{--bg:#0e1a11;--card:#16251a;--tx:#e6f2e8;--mu:#93aa98;--g:#2e7d32;--g2:#43a047;--gl:#1f3a24;--bd:#2a4030}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:3px solid var(--go)}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:28px 10px 10px}
.logo{height:150px;display:block;margin:0 auto 12px}.hl{height:30px;width:auto;flex:none}
.hero h2{margin:0;color:var(--g2);font-size:28px}.hero p{color:var(--mu);margin:4px 0 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:600;background:var(--g);color:#fff;margin-top:12px}
.btn.o{background:transparent;color:var(--g2);border:2px solid var(--g2)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:0}
.menu{display:grid;gap:12px}
.mi{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--g2);border-radius:14px;padding:18px;font-size:17px;font-weight:600;color:var(--tx);text-align:left;width:100%}
.mi span{font-size:30px}.mi small{display:block;font-weight:400;color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--gl);display:grid;place-items:center;font-size:26px;flex:none;border:2px solid var(--gl)}
.grow{flex:1;min-width:0}.nm{font-weight:600}.mu{color:var(--mu);font-size:14px}
.dot{width:20px;height:20px;border-radius:50%;flex:none;border:0}.dot.on{background:var(--on)}.dot.off{background:var(--red)}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.ph img{height:110px;border-radius:10px;flex:none;max-width:100%}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.t1{background:#f9a825}.t2{background:#ef6c00}.t3{background:#c62828}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.s{display:flex}#ov>div{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;display:none;font-size:14px}
.x{background:none;border:0;color:var(--red);font-size:13px;padding:4px 0}
.em{text-align:center;color:var(--mu);padding:30px 0}
</style>
</head>
<body>
<div id="app"></div><div id="ov"></div><div id="tt"></div>

 const a=$('#app');let h='';
 if(view==='login'){h=`<main><div class="hero"><img class="logo" alt="Logo Satpol PP" src="${LOGO}"><h2>Laweyan HIHU</h2><p>Tim Patroli Satpol PP · Kecamatan Laweyan</p></div>
 <button class="btn" onclick="go('form')">Login</button><button class="btn o" onclick="setRole('pengunjung');go('home')">Pengunjung</button></main>`}
 else if(view==='form'){h=head('Login',0)+`<main><div class="card"><label>Email (khusus Admin)</label><input id="em" type="email" autocomplete="username" placeholder="Kosongkan jika anggota"><label>Kata sandi / kode akses</label><input id="kd" type="password" autocomplete="current-password"><button class="btn" onclick="doLogin()">Masuk</button></div><button class="btn o" onclick="go('login')">Kembali</button></main>`}
 else if(view==='home'){h=head('Laweyan HIHU',0)+`<main><p class="mu">Masuk sebagai <b>${esc(role)}</b></p><div class="menu">
 <button class="mi" onclick="go('anggota')"><span>👮</span><div>Anggota<small>${D.members.length} personel</small></div></button>
 <button class="mi" onclick="go('aduan')"><span>📋</span><div>Aduan yang sudah tertangani<small>${D.aduan.length} aduan</small></div></button>
 <button class="mi" onclick="go('sp')"><span>⚠️</span><div>Monitoring SP<small>${D.sp.length} lokasi</small></div></button></div></main>`}
 else if(view==='anggota'){h=head('Anggota',1)+`<main>${isA()?'<button class="btn sm" onclick="addM()">+ Tambah anggota</button><p class="mu">Ketuk lingkaran untuk mengubah status.</p>':'<p class="mu">🟢 Masuk · 🔴 Libur</p>'}`+
 (D.members.map((m,i)=>`<div class="card row">${m.f?`<img class="av" src="${m.f}">`:'<div class="av">👤</div>'}<div class="grow"><div class="nm">${esc(m.n)}</div><div class="mu">NIP ${esc(m.nip)}</div>${isA()?`<button class="x" onclick="del('members',${i})">Hapus</button>`:''}</div><button class="dot ${m.on?'on':'off'}" ${isA()?`onclick="tog(${i})"`:'disabled'} aria-label="${m.on?'Masuk':'Libur'}"></button></div>`).join('')||'<div class="em">Belum ada anggota.</div>')+'</main>'}
 else if(view==='aduan'){h=head('Aduan Tertangani',1)+`<main>${isA()?'<button class="btn sm" onclick="addA()">+ Tambah aduan</button><br><br>':''}`+
 (D.aduan.map((x,i)=>`<div class="card"><div class="nm">${esc(x.t)}</div><div class="mu">${esc(x.d)} · ${esc(x.l)}</div><p>${esc(x.k)}</p><div class="mu">Ditangani: ${esc(x.p)}</div>${x.f?`<div class="ph"><img src="${x.f}"></div>`:''}${isA()?`<button class="x" onclick="del('aduan',${i})">Hapus</button>`:''}</div>`).join('')||'<div class="em">Belum ada riwayat aduan.</div>')+'</main>'}
 else if(view==='sp'){h=head('Monitoring SP',1)+`<main>${isA()?'<button class="btn sm" onclick="addS()">+ Tambah SP</button><br><br>':''}`+
 (D.sp.map((x,i)=>`<div class="card"><span class="tag t${x.s}">SP ${x.s}</span> <span class="nm">${esc(x.n)}</span><div class="mu">${esc(x.a)} · ${esc(x.d)}</div><div class="ph">${x.f1?`<img src="${x.f1}">`:''}${x.f2?`<img src="${x.f2}">`:''}</div><div class="mu">Foto lokasi &amp; foto surat peringatan</div>${isA()?`<button class="x" onclick="del('sp',${i})">Hapus</button>`:''}</div>`).join('')||'<div class="em">Belum ada data SP.</div>')+'</main>'}
 a.innerHTML=h}
async function doLogin(){const em=$('#em').value.trim(),k=$('#kd').value;
 try{if(em){await auth.signInWithEmailAndPassword(em,k);setRole('admin')}
 else{const c=await db.doc('config/access').get();if(c.exists&&k&&k===c.data().member)setRole('anggota');else return toast('Kode salah')}
 go('home')}catch(e){toast('Login gagal. Periksa email dan sandi.')}}
auth.onAuthStateChanged(u=>{if(role==='admin'&&!u){setRole(null);go('login')}});
function tog(i){const m=D.members[i];db.collection('members').doc(m.id).update({on:!m.on}).catch(fail)}
function del(k,i){if(confirm('Hapus data ini?'))db.collection(k).doc(D[k][i].id).delete().catch(fail)}
function shot(file){return new Promise(r=>{const im=new Image,u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.6))};im.src=u})}
function form(title,fs,ok){
 const o=$('#ov');o.innerHTML=`<div><h3>${title}</h3>${fs.map(f=>`<label>${f[1]}</label>${f[2]==='area'?`<textarea id="f_${f[0]}" rows="3"></textarea>`:f[2]==='img'?`<input id="f_${f[0]}" type="file" accept="image/*">`:f[2]==='sel'?`<select id="f_${f[0]}"><option>1</option><option>2</option><option>3</option></select>`:`<input id="f_${f[0]}" type="${f[2]==='date'?'date':'text'}">`}`).join('')}<button class="btn" id="ok">Simpan</button><button class="btn o" id="no">Batal</button></div>`;
 o.className='s';$('#no').onclick=()=>o.className='';
 $('#ok').onclick=async()=>{const v={};for(const f of fs){const e=$('#f_'+f[0]);v[f[0]]=f[2]==='img'?(e.files[0]?await shot(e.files[0]):''):e.value}if(!v[fs[0][0]])return toast('Isi data pertama');
 try{$('#ok').disabled=true;await ok(v);o.className=''}catch(e){$('#ok').disabled=false;fail(e)}}}
const add=(k,v)=>db.collection(k).add({...v,ts:T()});
function addM(){form('Anggota baru',[['n','Nama','t'],['nip','NIP','t'],['f','Foto','img']],v=>add('members',{...v,on:true}))}
function addA(){form('Aduan tertangani',[['t','Judul aduan','t'],['d','Tanggal','date'],['l','Lokasi','t'],['k','Uraian tindak lanjut','area'],['p','Petugas','t'],['f','Foto dokumentasi','img']],v=>add('aduan',v))}
function addS(){form('Surat Peringatan',[['n','Nama tempat','t'],['s','Tingkat SP','sel'],['a','Alamat','t'],['d','Tanggal','date'],['f1','Foto tempat','img'],['f2','Foto surat peringatan','img']],v=>add('sp',v))}
['members','aduan','sp'].forEach(k=>db.collection(k).orderBy('ts',k==='members'?'asc':'desc').onSnapshot(s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(view!=='form')render()},e=>toast('Gagal memuat data')));
render();
</script>
</body>
</html>
